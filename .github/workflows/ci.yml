# CI mínima: lo mismo que se pide en local antes de dar algo por terminado,
# pero sin depender de acordarse.
#
# No sustituye al build de Vercel (que sigue siendo quien despliega) y no corre
# los e2e: levantan un build de producción y leen Supabase, así que necesitarían
# secretos. Lo que sí caza, y Vercel no avisa hasta que el despliegue ya ha
# fallado o, peor, ha salido:
#   · lockfile desincronizado con package.json (Vercel instala con
#     --frozen-lockfile y tumba el despliegue antes de compilar)
#   · errores de tipos
#   · reglas de lint en error
#   · tests unitarios rotos (como sesiones-mes-render, que estuvo en rojo del
#     09-09 al 15-09-2026 sin que nadie lo viera)

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint y tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # La versión de pnpm sale de `packageManager` en package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar (lockfile congelado, como Vercel)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests unitarios
        run: pnpm test

  # Levanta un Postgres de Supabase vacío, le aplica TODAS las migraciones del
  # repo y el seed, y corre supabase/tests/database/*.test.sql (pgTAP).
  # Las migraciones van por scripts/db-reset-local.sh y no por el CLI: el CLI
  # se salta las que llevan letra en el nombre (0031a…0046f), ver el script.
  # Caza dos cosas que ni tsc ni vitest ven: una política de RLS que deja ver o
  # escribir lo que no debe (o que rompe con 42P17, como en 0031), y una
  # migración que ya no se puede reproducir desde cero.
  rls:
    name: RLS (pgTAP sobre las migraciones)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Levantar Postgres con todas las migraciones y el seed
        run: bash scripts/db-reset-local.sh

      - name: Tipos generados al día con las migraciones
        run: |
          supabase gen types typescript \
            --db-url "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --schema public > "$RUNNER_TEMP/database.generated.ts"
          if ! diff -u src/types/database.generated.ts "$RUNNER_TEMP/database.generated.ts"; then
            cp "$RUNNER_TEMP/database.generated.ts" database.generated.ci.ts
            echo "::error file=src/types/database.generated.ts::No coincide con las migraciones. Regenera con 'pnpm db:reset && pnpm db:types' (o descarga el artefacto database-generated-ts) y súbelo."
            exit 1
          fi

      - name: Artefacto con los tipos regenerados
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-generated-ts
          path: database.generated.ci.ts
          if-no-files-found: ignore
          retention-days: 7

      - name: Tests de RLS
        if: ${{ !cancelled() }}
        run: supabase test db

  # Login, roles, leads, asistencia y área de alumna en un navegador de verdad,
  # contra un Supabase local completo (Auth + API + Storage) con todas las
  # migraciones. Nunca contra producción: playwright.private.config.ts aborta
  # si la URL de Supabase no es local.
  e2e-privado:
    name: E2E del área privada (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Supabase local completo con todas las migraciones
        run: bash scripts/db-reset-local.sh --full

      - name: Claves del Supabase local
        run: |
          supabase status -o json > "$RUNNER_TEMP/supabase.json"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' "$RUNNER_TEMP/supabase.json")"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY' "$RUNNER_TEMP/supabase.json")"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY' "$RUNNER_TEMP/supabase.json")"
          } >> "$GITHUB_ENV"

      - name: Navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E del área privada
        run: pnpm test:e2e:private

      - name: Informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-area-privada
          path: |
            playwright-report/
            test-results/
          retention-days: 7
